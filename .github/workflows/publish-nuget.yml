name: Publish Sumapap NuGet Packages

on:
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Existing trigger for merged PRs
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  publish:
    # Run if it's a manual trigger OR if it's a merged PR
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event.pull_request.merged == true)
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cleanup NuGet Output Folder
        run: rm -rf .nuget/

      - name: Restore Dependencies
        run: dotnet restore src/

      - name: Process Projects
        run: |
          for file in src/**/*.csproj; do
            PROJECT_NAME=$(basename "$file" .csproj)

            # Evaluate the version (handles variables like $(AssemblyVersion))
            VERSION=$(dotnet msbuild "$file" --getProperty:VersionPrefix --nologo | xargs)
            if [ -z "$VERSION" ]; then
              VERSION=$(dotnet msbuild "$file" --getProperty:Version --nologo | xargs)
            fi

            if [ -z "$VERSION" ] || [ "$VERSION" == "0.0.0" ]; then
              echo ">> SKIPPING $PROJECT_NAME: No valid version found."
              continue
            fi

            echo "--- Checking $PROJECT_NAME (Version: $VERSION) ---"

            LOWER_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$LOWER_NAME/$VERSION/$LOWER_NAME.nuspec")

            if [ "$STATUS" == "200" ]; then
              echo ">> $PROJECT_NAME version $VERSION already exists. Skipping."
            else
              echo ">> $PROJECT_NAME version $VERSION is new! Packing..."
              dotnet pack "$file" -c Release --no-restore -o .nuget/
            fi
          done

      - name: Push to NuGet
        run: |
          if [ -d ".nuget" ] && [ "$(ls -A .nuget/*.nupkg 2>/dev/null)" ]; then
            dotnet nuget push ".nuget/*.nupkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          else
            echo "No new packages found to push."
          fi

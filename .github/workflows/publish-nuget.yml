name: Publish Sumapap NuGet Packages

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cleanup NuGet Output Folder
        run: rm -rf .nuget/

      - name: Restore Dependencies
        run: dotnet restore src/

      # 1. LOOP THROUGH PROJECTS AND CHECK INDIVIDUAL VERSIONS
      - name: Pack New Versions Only
        run: |
          for file in src/**/*.csproj; do
            # Extract project name (e.g., Sumapap.Ddd)
            PROJECT_NAME=$(basename "$file" .csproj)
            
            # Extract version from THIS specific .csproj file
            # It checks for <Version> or <VersionPrefix>
            VERSION=$(grep -oPm1 "(?<=<(Version|VersionPrefix)>)[^<]+" "$file" || true)
            
            # Fallback: if not in .csproj, try checking Directory.Build.props 
            if [ -z "$VERSION" ]; then
              VERSION=$(grep -oPm1 "(?<=<VersionPrefix>)[^<]+" src/Directory.Build.props || true)
            fi

            echo "--- Checking $PROJECT_NAME (Version: $VERSION) ---"

            if [ -z "$VERSION" ]; then
              echo ">> Error: Could not find version for $PROJECT_NAME. Skipping."
              continue
            fi

            # Check NuGet API for this specific package and version
            LOWER_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$LOWER_NAME/$VERSION/$LOWER_NAME.nuspec")

            if [ "$STATUS" == "200" ]; then
              echo ">> $PROJECT_NAME version $VERSION already exists on NuGet. Skipping."
            else
              echo ">> $PROJECT_NAME version $VERSION is new! Packing..."
              dotnet pack "$file" -c Release --no-restore
            fi
          done

      # 2. PUSH ONLY WHAT WAS PACKED
      - name: Push to NuGet
        run: |
          if [ -d ".nuget" ] && [ "$(ls -A .nuget/*.nupkg 2>/dev/null)" ]; then
            dotnet nuget push ".nuget/*.nupkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          else
            echo "No new packages found to push."
          fi

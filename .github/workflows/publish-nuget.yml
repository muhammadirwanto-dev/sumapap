name: Publish Sumapap NuGet Packages

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cleanup NuGet Output Folder
        run: mkdir -p .nuget && rm -rf .nuget/*

      - name: Restore Dependencies
        run: dotnet restore src/

      # Fix for NU5026: Build the binaries before attempting to pack
      - name: Build Projects
        run: dotnet build src/ -c Release --no-restore

      - name: Process and Pack Projects
        id: pack_step
        run: |
          SUCCESS_PACKS=()
          FAILED_PACKS=()
          SKIPPED_PACKS=()

          for file in src/**/*.csproj; do
            PROJECT_NAME=$(basename "$file" .csproj)
            
            # Explicitly pass -p:Configuration=Release to ensure MSBuild evaluates Directory.Build.props
            GENERATE_PACKAGE=$(dotnet msbuild "$file" --getProperty:GeneratePackageOnBuild -p:Configuration=Release --nologo | xargs | tr '[:upper:]' '[:lower:]')
            
            echo ">> [DEBUG] $PROJECT_NAME GeneratePackageOnBuild: '$GENERATE_PACKAGE'"
            
            if [ "$GENERATE_PACKAGE" == "false" ]; then
              SKIPPED_PACKS+=("$PROJECT_NAME (Disabled)")
              continue
            fi
            
            VERSION=$(dotnet msbuild "$file" --getProperty:VersionPrefix --nologo | xargs)
            [ -z "$VERSION" ] && VERSION=$(dotnet msbuild "$file" --getProperty:Version --nologo | xargs)

            if [ -z "$VERSION" ] || [ "$VERSION" == "0.0.0" ]; then
              SKIPPED_PACKS+=("$PROJECT_NAME (No Version)")
              continue
            fi

            LOWER_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.nuget.org/v3-flatcontainer/$LOWER_NAME/$VERSION/$LOWER_NAME.nuspec")

            if [ "$STATUS" == "200" ]; then
              SKIPPED_PACKS+=("$PROJECT_NAME ($VERSION) - Existing")
            else
              echo ">> Attempting to pack $PROJECT_NAME ($VERSION)..."
              # Added --no-build because we built in the previous step
              if dotnet pack "$file" -c Release --no-build --no-restore -o .nuget/; then
                SUCCESS_PACKS+=("$PROJECT_NAME ($VERSION)")
              else
                echo "::warning title=Pack Failure::$PROJECT_NAME failed to pack."
                FAILED_PACKS+=("$PROJECT_NAME ($VERSION)")
              fi
            fi
          done

          # Use pipe delimiter to prevent string splitting on spaces in project names
          echo "SUCCESS_LIST=$(printf "|%s" "${SUCCESS_PACKS[@]}")" >> $GITHUB_ENV
          echo "FAILED_LIST=$(printf "|%s" "${FAILED_PACKS[@]}")" >> $GITHUB_ENV
          echo "SKIPPED_LIST=$(printf "|%s" "${SKIPPED_PACKS[@]}")" >> $GITHUB_ENV

      - name: Push to NuGet
        run: |
          if [ -d ".nuget" ] && [ "$(ls -A .nuget/*.nupkg 2>/dev/null)" ]; then
            dotnet nuget push ".nuget/*.nupkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi

      - name: Final Summary
        run: |
          echo "--------------------------------------------------"
          
          if [ ! -z "$SUCCESS_LIST" ]; then
            echo "✅ SUCCESSFULLY UPLOADED:"
            IFS='|' read -ra ADDR <<< "$SUCCESS_LIST"
            for i in "${ADDR[@]}"; do [ -z "$i" ] || echo "  - $i"; done
            echo ""
          fi
          
          if [ ! -z "$FAILED_LIST" ]; then
            echo "⚠️ FAILED (NOT UPLOADED):"
            IFS='|' read -ra ADDR <<< "$FAILED_LIST"
            for i in "${ADDR[@]}"; do [ -z "$i" ] || echo "  - $i"; done
            echo ""
          fi
          
          if [ ! -z "$SKIPPED_LIST" ]; then
            echo "⏭️ SKIPPED (EXISTING, NO VERSION, OR DISABLED):"
            IFS='|' read -ra ADDR <<< "$SKIPPED_LIST"
            for i in "${ADDR[@]}"; do [ -z "$i" ] || echo "  - $i"; done
          fi
          
          echo "--------------------------------------------------"

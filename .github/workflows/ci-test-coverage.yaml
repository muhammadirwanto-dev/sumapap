name: CI - Verify Dev PR (Tests & Coverage)

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    types: [ opened, synchronize, reopened ]

permissions:
  pull-requests: write
  contents: write

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    env:
      MIN_GREEN: 90
      MIN_YELLOW: 70
      COVERAGE_JSON_FILE: "sumapap-coverage.json"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Remove MAUI projects from solution (they require macOS for iOS/Catalyst workloads)
      - name: Remove MAUI Projects from Solution
        run: |
          for csproj in src/**/*.csproj; do
            if grep -q '<UseMaui>true</UseMaui>' "$csproj"; then
              echo "🗑️ Removing MAUI project from solution: $csproj"
              dotnet sln src/Sumapap.slnx remove "$csproj" || true
            fi
          done

          # List remaining projects
          echo ""
          echo "📋 Remaining projects in solution:"
          dotnet sln src/Sumapap.slnx list

      # Restore and build (MAUI projects already removed)
      - name: Restore Dependencies
        run: |
          dotnet restore src/Sumapap.slnx
          dotnet restore tests/Sumapap.Tests.slnx

      - name: Build Source Projects
        run: |
          dotnet build src/Sumapap.slnx -c Release --no-restore

      - name: Build Tests
        run: |
          dotnet build tests/Sumapap.Tests.slnx -c Release --no-restore

      # Run tests via the Test Solution, but isolate coverage filters to Sumapap.* core assemblies
      # (Excludes files ending in .Tests from dragging down or masking the real business logic metrics)
      - name: Run Unit Tests
        run: |
          dotnet test tests/Sumapap.Tests.slnx -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Sumapap.*]*" \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[* *.Tests]*" \
            DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.IncludeDirectory="src/**/bin/Release/"

      - name: Code Coverage Summary
        id: coverage_summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'TestResults/**/*.xml'
          badge: true
          fail_below_min: false 
          format: markdown
          output: both
          thresholds: "${{ env.MIN_YELLOW }} ${{ env.MIN_GREEN }}"

      - name: Evaluate Coverage & Prepare Notice
        id: eval_coverage
        run: |
          ACTUAL_COVERAGE=$(grep "Summary" code-coverage-results.md | sed -n 's/^[^|]*|[^*]*\*\*\([0-9]\+\)%.*/\1/p' | head -n 1)
          ACTUAL_COVERAGE=${ACTUAL_COVERAGE:-0}
          echo "ACTUAL_COVERAGE=$ACTUAL_COVERAGE" >> $GITHUB_ENV
          
          # Determine Color for the Gist Badge
          COLOR="red"
          if [ "$ACTUAL_COVERAGE" -ge "${{ env.MIN_GREEN }}" ]; then COLOR="brightgreen";
          elif [ "$ACTUAL_COVERAGE" -ge "${{ env.MIN_YELLOW }}" ]; then COLOR="yellow"; fi
          echo "BADGE_COLOR=$COLOR" >> $GITHUB_ENV
          
          echo "### 📊 Pull Request Code Coverage Report" > pr_comment.md
          cat code-coverage-results.md >> pr_comment.md
          echo -e "\n---" >> pr_comment.md
          
          if [ "$ACTUAL_COVERAGE" -ge "${{ env.MIN_GREEN }}" ]; then
            echo -e "\n🟢 **Excellent!** Code coverage is at **${ACTUAL_COVERAGE}%** (Target: >${{ env.MIN_GREEN }}%). Your changes are safely covered by tests." >> pr_comment.md
          elif [ "$ACTUAL_COVERAGE" -ge "${{ env.MIN_YELLOW }}" ]; then
            echo -e "\n🟡 **Attention:** Code coverage is at **${ACTUAL_COVERAGE}%** (Warning Zone: ${{ env.MIN_YELLOW }}% - ${{ env.MIN_GREEN }}%). Please create a separate ticket in your backlog to fill in missing unit tests when project priorities allow." >> pr_comment.md
          else
            echo -e "\n🔴 **Action Required:** Code coverage is at **${ACTUAL_COVERAGE}%** (Critical Zone: <${{ env.MIN_YELLOW }}%). While this PR remains mergeable, it is highly recommended to log a tracking ticket immediately to address the missing coverage before this feature scales." >> pr_comment.md
          fi

      - name: Write to GitHub Job Summary
        run: cat pr_comment.md >> $GITHUB_STEP_SUMMARY

      - name: Post Coverage Comment to PR
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v3
        with:
          message-path: pr_comment.md

      - name: Update Coverage Badge Gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: '41038afccedef8e2268247b2d75d71e0'
          filename: ${{ env.COVERAGE_JSON_FILE }}
          label: Code Coverage
          message: "${{ env.ACTUAL_COVERAGE }}%"
          color: ${{ env.BADGE_COLOR }}
          style: flat-square